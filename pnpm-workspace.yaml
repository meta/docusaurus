nodeLinker: 'isolated'

# Link init templates (which can't use workspace:*) to local packages
linkWorkspacePackages: true

packages:
  - 'packages/*'
  - 'argos'
  - 'website'
  - 'test-website-in-workspace'
  - 'packages/create-docusaurus/templates/*'
  - 'admin/scripts'
  - 'admin/test-bad-package'
  - 'admin/new.docusaurus.io'

# pnpm add only accepts catalog versions
catalogMode: strict
# pnpm install removes the unused catalog entries
catalogPrune: true

# Versions of all the monorepo dependencies, referenced with the catalog: protocol

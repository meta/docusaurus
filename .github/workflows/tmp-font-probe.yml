# TEMPORARY, DO NOT MERGE: measures the fonts Chromium renders for #11727
name: TMP font probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [8-core-ubuntu, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Write probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright-core@1.63.0 > /dev/null
          cat > probe.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          const label = process.argv[2] ?? 'default';
          const STACKS = {
            before: `system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'`,
            after: `-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'`,
            removedOnly: `-apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'`,
            systemUi: 'system-ui',
            appleSystem: '-apple-system',
            sansSerif: 'sans-serif',
          };
          const SAMPLES = [
            ['en', 'The quick brown fox'],
            ['zh-CN', '今令直骨角次'],
            ['zh-TW', '今令直骨角次'],
            ['ja', '今令直骨角次かな'],
            ['ko', '今令直骨角次 한국어'],
            ['', '今令直骨角次 (no lang)'],
          ];
          const channels = process.platform === 'linux' ? [undefined] : ['chrome', 'msedge'];
          for (const channel of channels) {
            let browser;
            try {
              browser = await chromium.launch(channel ? {channel} : {});
            } catch (err) {
              console.log(`${channel}: cannot launch (${err.message.split('\n')[0]})`);
              continue;
            }
            const page = await browser.newPage();
            const html = Object.entries(STACKS).map(([k, v]) =>
              `<h3>${k}</h3>` + SAMPLES.map(([lang, t], i) => `<p id="${k}-${i}" ${lang ? `lang="${lang}"` : ''} style="font-family:${v.replaceAll('"', "'")};font-size:24px;margin:0">${lang || 'nolang'}: ${t}</p>`).join('')).join('');
            await page.setContent(`<html lang="en"><body>${html}</body></html>`);
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            const {root} = await cdp.send('DOM.getDocument');
            console.log(`\n### ${label} / ${channel ?? 'playwright chromium'} ${browser.version()}`);
            for (const k of Object.keys(STACKS)) {
              const row = [];
              for (let i = 0; i < SAMPLES.length; i++) {
                const {nodeId} = await cdp.send('DOM.querySelector', {nodeId: root.nodeId, selector: `#${k}-${i}`});
                const {fonts} = await cdp.send('CSS.getPlatformFontsForNode', {nodeId});
                row.push(`${SAMPLES[i][0] || 'nolang'}: ${fonts.map((f) => `${f.familyName}(${f.glyphCount})`).join(' + ')}`);
              }
              console.log(`${k.padEnd(12)} ${row.join(' | ')}`);
            }
            await page.screenshot({path: `screenshot-${label}-${channel ?? 'chromium'}.png`, fullPage: true});
            await browser.close();
          }
          EOF

      - name: Linux fonts
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/probe"
          npx playwright-core install --with-deps chromium > /dev/null
          for pattern in system-ui sans-serif 'sans-serif:lang=ja' 'sans-serif:lang=zh-cn' 'sans-serif:lang=zh-tw' 'sans-serif:lang=ko' Roboto Ubuntu Cantarell 'Noto Sans'; do
            echo "fc-match '$pattern': $(fc-match "$pattern")"
          done
          fc-list : family | sort -u
          node probe.mjs linux

      - name: macOS fonts
        if: runner.os == 'macOS'
        run: cd "$RUNNER_TEMP/probe" && node probe.mjs macos

      - name: Windows fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP/probe"
          Get-ChildItem C:\Windows\Fonts -Include *yu*,*meiryo*,*msyh*,*msjh*,*malgun*,*segoe* -Recurse | Select-Object -ExpandProperty Name
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
          public struct LOGFONT { public int lfHeight; public int lfWidth; public int lfEscapement; public int lfOrientation; public int lfWeight; public byte lfItalic; public byte lfUnderline; public byte lfStrikeOut; public byte lfCharSet; public byte lfOutPrecision; public byte lfClipPrecision; public byte lfQuality; public byte lfPitchAndFamily; [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string lfFaceName; }
          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
          public struct NONCLIENTMETRICS { public int cbSize; public int iBorderWidth; public int iScrollWidth; public int iScrollHeight; public int iCaptionWidth; public int iCaptionHeight; public LOGFONT lfCaptionFont; public int iSmCaptionWidth; public int iSmCaptionHeight; public LOGFONT lfSmCaptionFont; public int iMenuWidth; public int iMenuHeight; public LOGFONT lfMenuFont; public LOGFONT lfStatusFont; public LOGFONT lfMessageFont; public int iPaddedBorderWidth; }
          public static class Ncm {
            [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            static extern bool SystemParametersInfo(uint action, uint param, ref NONCLIENTMETRICS ncm, uint winIni);
            static NONCLIENTMETRICS Read() { var n = new NONCLIENTMETRICS(); n.cbSize = Marshal.SizeOf(n); SystemParametersInfo(0x29, (uint)n.cbSize, ref n, 0); return n; }
            public static string Get() { return Read().lfMessageFont.lfFaceName; }
            public static bool Set(string face) { var n = Read(); n.lfMessageFont.lfFaceName = face; return SystemParametersInfo(0x2A, (uint)n.cbSize, ref n, 3); }
          }
          "@
          Write-Output "Message font: $([Ncm]::Get())"
          node probe.mjs windows-default
          # Simulates the message font of the CJK display languages, the only input of system-ui
          foreach ($face in 'Yu Gothic UI', 'Microsoft YaHei UI', 'Microsoft JhengHei UI', 'Malgun Gothic') {
            $ok = [Ncm]::Set($face)
            Write-Output "`nSet message font to '$face': $ok, now '$([Ncm]::Get())'"
            node probe.mjs "windows-$($face -replace ' ', '')"
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-probe-${{ runner.os }}
          path: ${{ runner.temp }}/probe/*.png

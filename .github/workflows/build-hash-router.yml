name: Build Hash Router

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - packages/**
      - .github/workflows/build-hash-router.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

# ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
# This workflow can write to the repository (GitHub Pages deployment)
# See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

jobs:
  build:
    name: Build Hash Router
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          # Only install pnpm: Node.js and dependencies are installed by later steps
          install: false
          node-version-file: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
      - name: Installation
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile || pnpm install --frozen-lockfile

      - name: Build Hash Router
        run: pnpm build:website:fast
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
          DOCUSAURUS_ROUTER: 'hash'
          # Note: hash router + baseUrl do not play well together
          # This would host at https://facebook.github.io/docusaurus/#/docusaurus/
          # BASE_URL: '/docusaurus/' # hash router +

      - name: Upload Website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-hash-router-archive
          path: website/build

      #- name: Upload Website Pages artifact
      #  uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
      #  with:
      #    path: website/build

      # Deploy to https://facebook.github.io/docusaurus/
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build

  ## TODO we should be able to use this new deploy-pages action
  ## However this requires a Meta admin to configure it here
  ## https://github.com/facebook/docusaurus/settings/pages
  ## So for now we keep using the former method
  ## See https://docusaurus.io/docs/deployment#triggering-deployment-with-github-actions
